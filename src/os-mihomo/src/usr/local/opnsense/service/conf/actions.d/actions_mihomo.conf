[start]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh start
parameters:
type:script
message:starting mihomo

[stop]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh stop
parameters:
type:script
message:stopping mihomo

[restart]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh restart
parameters:
type:script
message:restarting mihomo
description:Restart mihomo service

[reload]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh reload
parameters:
type:script
message:reloading mihomo
description:Reload mihomo service

[status]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh status
parameters:
type:script_output
message:request mihomo status

[healthcheck]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh healthcheck
parameters:
type:script_output
message:request mihomo healthcheck

[watchdog]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/watchdog.sh
parameters:
type:script
message:Run Mihomo fail-open watchdog probe

[failopen]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/service_manager.sh failopen
parameters:%s
type:script
message:Trigger manual Fail-Open bypass for Mihomo

[version]
command:/usr/local/bin/mihomo -v 2>/dev/null || echo "Unknown"
parameters:
type:script_output
message:request mihomo version

[log]
command:/usr/bin/tail -n %s /var/log/mihomo.log 2>/dev/null || true
parameters:%s
type:script_output
message:request mihomo log

[system-status]
command:/usr/local/bin/python3 -c 'import json, subprocess, os, re; state_file = "/var/run/mihomo_state.json"; db_state_file = "/var/db/os-mihomo/state.json"; target_file = state_file if os.path.exists(state_file) else (db_state_file if os.path.exists(db_state_file) else None); data = {};\nif target_file:\n    try:\n        with open(target_file, "r") as f:\n            data = json.load(f)\n    except Exception:\n        pass\npid = data.get("pid")\nif not pid:\n    try:\n        with open("/var/run/mihomo.pid", "r") as f:\n            pid = int(f.read().strip())\n    except Exception:\n        pass\nmem = "0 MB"\nif pid:\n    (ps_out, _) = subprocess.Popen(["ps", "-o", "rss=", "-p", str(pid)], stdout=subprocess.PIPE, stderr=subprocess.PIPE).communicate()\n    rss = ps_out.decode().strip()\n    mem = f"{int(rss)/1024:.1f} MB" if rss.isdigit() else "0 MB"\nif_res = subprocess.call(["ifconfig", "tun_mihomo"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\ntun = "UP" if if_res == 0 else "DOWN"\napi_res = subprocess.call(["sockstat", "-4", "-l", "-p", "9090"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\napi = "UP" if api_res == 0 else "DOWN"\ndata["memory"] = mem\ndata["tun_status"] = tun\ndata["api_status"] = api\nprint(json.dumps(data))' 2>/dev/null || echo "{}"
parameters:
type:script_output
message:request mihomo system status

[sub-update]
command:/usr/bin/mihomo_sub
parameters:
type:script_output
description:Renew mihomo Subscription

[secret-get]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh get
parameters:
type:script_output
message:get mihomo secret

[secret-generate]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh generate
parameters:
type:script_output
message:generate new mihomo secret

[secret-masked]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/secret_manager.sh masked
parameters:
type:script_output
message:get masked mihomo secret

[config-atomic-update]
command:/usr/local/opnsense/scripts/OPNsense/Mihomo/atomic_config_updater.sh %s %s
parameters:%s %s
type:script_output
message:atomic update mihomo configuration
